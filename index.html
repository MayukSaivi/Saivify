<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saivify - Advanced Health & Symptom Analyzer</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .pwa-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pwa-btn:hover {
            opacity: 0.9;
        }

        /* Main Container - Responsive Grid for PC & Mobile */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            nav {
                padding: 15px 20px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-dark);
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 10px;
            display: none;
        }

        /* Step 2 hidden section for Advanced Disease Analyzer */
        #step2-container {
            display: none;
            margin-top: 15px;
            border-top: 2px dashed var(--border-color);
            padding-top: 15px;
        }

        .disclaimer {
            font-size: 0.8rem;
            color: var(--danger);
            margin-top: 15px;
            text-align: center;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo-area">
            <!-- Yahan aap apna uploaded logo file name dal sakte hain jaise logo.png -->
            <img src="1.png" alt="Saivify Logo">
            <h1>Saivify</h1>
        </div>
        <div class="nav-buttons">
            <button class="pwa-btn" onclick="installApp()">📥 Download App</button>
        </div>
    </nav>

    <!-- Main Content Area (PC Optimized Grid) -->
    <div class="main-container">

        <!-- BMI Calculator Module -->
        <div class="card">
            <h2>⚖️ Advanced BMI Calculator</h2>
            <div class="form-group">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 175">
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 70">
            </div>
            <button class="action-btn" onclick="calculateBMI()">Calculate BMI</button>
            <div id="bmiResult" class="result-box"></div>
        </div>

        <!-- Disease & Symptom Analyzer Module -->
        <div class="card">
            <h2>🩺 Smart Symptom & Disease Analyzer</h2>
            
            <div class="form-group">
                <label for="primarySymptom">Select Primary Symptom / Area:</label>
                <select id="primarySymptom" onchange="loadPotentialDiseases()">
                    <option value="">-- Choose Symptom --</option>
                    <option value="fever">High Fever, Chills & Body Ache</option>
                    <option value="respiratory">Cough, Cold & Breathing Issue</option>
                    <option value="skin">Skin Rash, Itching or Fungal Patches</option>
                    <option value="stomach">Stomach Pain, Nausea or Acidity</option>
                </select>
            </div>

            <!-- Step 1: Potential Matches -->
            <div id="potentialMatches" class="form-group" style="display:none;">
                <label>Possible Conditions Detected (Select one to proceed):</label>
                <select id="matchedDisease">
                    <!-- Populated dynamically -->
                </select>
                <button class="action-btn" style="margin-top: 15px; background: #059669;" onclick="proceedToDeepAnalysis()">Continue Research & Deep Analysis</button>
            </div>

            <!-- Step 2: Detailed Deep Analysis Inputs -->
            <div id="step2-container">
                <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--primary);">Provide Detailed History</h3>
                
                <div class="form-group">
                    <label for="duration">How many days have you had this condition?</label>
                    <input type="text" id="duration" placeholder="e.g. 3 days">
                </div>

                <div class="form-group">
                    <label for="severity">Describe the most severe symptom / pain level:</label>
                    <input type="text" id="severity" placeholder="e.g. Mild, Moderate, or Severe throbbing">
                </div>

                <div class="form-group">
                    <label for="skinImage">Upload Photo (Optional - for skin/fungal or visible analysis):</label>
                    <input type="file" id="skinImage" accept="image/*">
                </div>

                <button class="action-btn" onclick="generateFinalReport()">Generate Comprehensive Report</button>
            </div>

            <div id="diseaseResult" class="result-box"></div>
            <p class="disclaimer">*Disclaimer: Saivify is an AI health analyzer tool. Always consult a certified medical doctor for treatment.</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Saivify. All rights reserved. Built with precision for your health.</p>
    </footer>

    <script>
        // Advanced BMI Calculator logic
        function calculateBMI() {
            const h = document.getElementById('height').value;
            const w = document.getElementById('weight').value;
            const res = document.getElementById('bmiResult');

            if(!h || !w || h <= 0 || w <= 0) {
                res.style.display = 'block';
                res.style.background = '#fee2e2';
                res.style.color = '#991b1b';
                res.innerHTML = "Please enter valid height and weight measurements!";
                return;
            }

            const heightM = h / 100;
            const bmi = (w / (heightM * heightM)).toFixed(1);
            let category = "";
            let colorBg = "#f1f5f9";

            if(bmi < 18.5) {
                category = "Underweight (Needs higher caloric nutrition)";
                colorBg = "#dbeafe";
            } else if(bmi >= 18.5 && bmi <= 24.9) {
                category = "Normal & Healthy Weight 🎉";
                colorBg = "#d1fae5";
            } else if(bmi >= 25 && bmi <= 29.9) {
                category = "Overweight (Consider regular cardio/diet)";
                colorBg = "#fef3c7";
            } else {
                category = "Obese (Medical consultation recommended)";
                colorBg = "#fee2e2";
            }

            res.style.display = 'block';
            res.style.background = colorBg;
            res.style.color = '#0f172a';
            res.innerHTML = `<strong>Your BMI Score: ${bmi}</strong><br>Category: ${category}`;
        }

        // Dynamic Disease Matcher based on symptom
        function loadPotentialDiseases() {
            const symptom = document.getElementById('primarySymptom').value;
            const matchBox = document.getElementById('potentialMatches');
            const diseaseSelect = document.getElementById('matchedDisease');
            
            document.getElementById('step2-container').style.display = 'none';
            document.getElementById('diseaseResult').style.display = 'none';

            if(!symptom) {
                matchBox.style.display = 'none';
                return;
            }

            matchBox.style.display = 'block';
            diseaseSelect.innerHTML = '';

            let options = [];
            if(symptom === 'fever') {
                options = ["Viral Fever", "Malaria", "Dengue", "Typhoid"];
            } else if(symptom === 'respiratory') {
                options = ["Common Cold / Influenza", "Acute Bronchitis", "Allergic Rhinitis", "Sinusitis"];
            } else if(symptom === 'skin') {
                options = ["Tinea Infection (Ringworm / Fungal)", "Eczema", "Contact Dermatitis", "Urticaria (Hives)"];
            } else if(symptom === 'stomach') {
                options = ["Gastritis / Acidity", "Food Poisoning", "Gastroenteritis", "Irritable Bowel Syndrome (IBS)"];
            }

            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt;
                el.textContent = opt;
                diseaseSelect.appendChild(el);
            });
        }

        // Proceed to detailed questions (Duration, severity, photo)
        function proceedToDeepAnalysis() {
            const selected = document.getElementById('matchedDisease').value;
            if(!selected) {
                alert("Please select a potential condition first!");
                return;
            }
            document.getElementById('step2-container').style.display = 'block';
        }

        // Final Deep Report generation
        function generateFinalReport() {
            const disease = document.getElementById('matchedDisease').value;
            const duration = document.getElementById('duration').value || "Not specified";
            const severity = document.getElementById('severity').value || "Not specified";
            const fileInput = document.getElementById('skinImage');
            const res = document.getElementById('diseaseResult');

            let imageNote = "No image uploaded.";
            if(fileInput.files && fileInput.files[0]) {
                imageNote = `Image attached: <strong>${fileInput.files[0].name}</strong> (Received for visual assessment)`;
            }

            res.style.display = 'block';
            res.style.background = '#f0fdf4';
            res.style.color = '#065f46';
            res.innerHTML = `
                <h4 style="margin-bottom:8px; color:#047857;">📋 Saivify Comprehensive Health Assessment</h4>
                <p><strong>Primary Suspected Condition:</strong> ${disease}</p>
                <p><strong>Duration:</strong> ${duration}</p>
                <p><strong>Severity Analysis:</strong> ${severity}</p>
                <p><strong>Visual Check:</strong> ${imageNote}</p>
                <hr style="margin: 10px 0; border:0; border-top:1px solid #a7f3d0;">
                <p style="font-size:0.9rem;"><strong>Recommendation:</strong> Rest well, maintain strict hydration, avoid self-medication, and visit a verified specialist if symptoms persist beyond 48 hours.</p>
            `;
        }

        // PWA Download / Install App simulator
        function installApp() {
            alert("Saivify PWA: To install this web app on your device, open your browser menu (three dots) and select 'Add to Home Screen' or 'Install App'.");
        }
    </script>
</body>
</html>
