<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saivify - Fun Smart Health Hub! 🎨🤖</title>
    <!-- Playful Cartoony Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0f2fe;
            --card-bg: #ffffff;
            --primary: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --text-main: #1e1b4b;
            --border-color: #312e81;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#bae6fd 25%, transparent 25%);
            background-size: 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cartoony Navbar */
        nav {
            background: var(--card-bg);
            border-bottom: 4px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 0px var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-badge {
            width: 50px;
            height: 50px;
            background: var(--accent-pink);
            border: 3px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .logo-area h1 {
            font-size: 2rem;
            color: var(--accent-pink);
            text-shadow: 2px 2px 0px var(--border-color);
            letter-spacing: 1px;
        }

        .pwa-btn {
            background: var(--accent-green);
            color: white;
            border: 3px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: transform 0.1s;
        }

        .pwa-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        /* Responsive Layout Grid */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            nav {
                padding: 15px 20px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .card h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #ddd;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            background: #fff;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-color);
        }

        input:focus, textarea:focus {
            background: #fef08a;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-yellow);
            color: var(--text-main);
            border: 3px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .action-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #d9f99d;
            border: 3px solid var(--border-color);
            border-radius: 15px;
            font-weight: 600;
            display: none;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .disclaimer {
            font-size: 0.85rem;
            color: #e11d48;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-main);
            font-weight: 600;
            border-top: 4px solid var(--border-color);
            background: #ffffff;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Cartoony Navbar -->
    <nav>
        <div class="logo-area">
            <div class="logo-badge">🩺</div>
            <h1>SAIVIFY</h1>
        </div>
        <div class="nav-buttons">
            <button class="pwa-btn" onclick="installApp()">📥 Download App</button>
        </div>
    </nav>

    <!-- Main Grid -->
    <div class="main-container">

        <!-- BMI Calculator Module -->
        <div class="card" style="background: #eff6ff;">
            <h2>⚖️ Fun BMI Calculator</h2>
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" placeholder="e.g. 175">
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" placeholder="e.g. 70">
            </div>
            <button class="action-btn" style="background-color: #38bdf8;" onclick="calculateBMI()">Calculate BMI</button>
            <div id="bmiResult" class="result-box"></div>
        </div>

        <!-- Advanced AI Symptom & Disease Analyzer Module -->
        <div class="card" style="background: #fdf2f8;">
            <h2>🤖 Advanced AI Symptom Analyzer</h2>
            
            <div class="form-group">
                <label for="userSymptoms">Describe your symptoms / condition:</label>
                <textarea id="userSymptoms" rows="2" placeholder="e.g., severe headache, skin fungal rash, high fever..."></textarea>
            </div>

            <div class="form-group">
                <label for="duration">How many days have you had this?</label>
                <input type="text" id="duration" placeholder="e.g. 3 days">
            </div>

            <div class="form-group">
                <label for="severity">What is the peak severity level?</label>
                <input type="text" id="severity" placeholder="e.g. Mild / Moderate / Unbearable pain">
            </div>

            <div class="form-group">
                <label for="skinImage">Upload Photo (For rash/fungal/skin check):</label>
                <input type="file" id="skinImage" accept="image/*">
            </div>

            <button class="action-btn" style="background-color: #f472b6;" onclick="runSmartAIAnalysis()">Run Deep AI Analysis</button>
            
            <div id="aiResult" class="result-box" style="background: #fef08a;"></div>
            <p class="disclaimer">*Disclaimer: AI tool for initial insights. Always consult a medical professional! 🩺</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Saivify. Smart health tracking made fun & reliable! 🚀</p>
    </footer>

    <script>
        function calculateBMI() {
            const h = document.getElementById('height').value;
            const w = document.getElementById('weight').value;
            const res = document.getElementById('bmiResult');

            if(!h || !w || h <= 0 || w <= 0) {
                res.style.display = 'block';
                res.style.background = '#fca5a5';
                res.innerHTML = "Please enter correct height and weight numbers! 😅";
                return;
            }

            const heightM = h / 100;
            const bmi = (w / (heightM * heightM)).toFixed(1);
            let msg = "";

            if(bmi < 18.5) msg = `BMI: ${bmi} — Underweight! Eat nutrient-rich food! 🍎`;
            else if(bmi <= 24.9) msg = `BMI: ${bmi} — Normal & Super Fit! 🎉`;
            else if(bmi <= 29.9) msg = `BMI: ${bmi} — Overweight! Time for some daily workouts! 🏃‍♂️`;
            else msg = `BMI: ${bmi} — High BMI! Focus on your diet and fitness! 💪`;

            res.style.display = 'block';
            res.style.background = '#d9f99d';
            res.innerHTML = msg;
        }

        function runSmartAIAnalysis() {
            const text = document.getElementById('userSymptoms').value.toLowerCase().trim();
            const duration = document.getElementById('duration').value.trim() || "Not specified";
            const severity = document.getElementById('severity').value.trim() || "Not specified";
            const fileInput = document.getElementById('skinImage');
            const res = document.getElementById('aiResult');

            if(!text) {
                res.style.display = 'block';
                res.style.background = '#fca5a5';
                res.innerHTML = "Please describe your symptoms in the text box first! 🤖";
                return;
            }

            let conditions = [];
            let recommendations = "";

            // Dynamic intelligent matching based on user text input
            if(text.includes('cancer') || text.includes('tumor') || text.includes('malignant')) {
                conditions = ["Oncology Assessment Required", "Severe Persistent Cellular Anomaly", "Chronic Inflammatory Condition", "Benign Growth / Tissue Swelling"];
                recommendations = "⚠️ Critical Alert: Mention of severe conditions requires immediate physical evaluation by an oncologist or specialist doctor. Do not rely solely on online tools.";
            } else if(text.includes('fever') || text.includes('cold') || text.includes('cough') || text.includes('temperature')) {
                conditions = ["Viral Influenza / Seasonal Flu", "Acute Upper Respiratory Infection", "Bacterial Bronchitis", "Allergic Rhinitis"];
                recommendations = "Isolate if contagious, maintain fluid intake, and consult a general physician if fever persists over 48 hours.";
            } else if(text.includes('skin') || text.includes('fungal') || text.includes('rash') || text.includes('itch') || text.includes('patch')) {
                conditions = ["Tinea Corporis (Ringworm / Fungal)", "Contact Dermatitis", "Eczema Flare-up", "Allergic Hives (Urticaria)"];
                recommendations = "Keep the affected area clean and dry. Avoid sharing towels. Consult a dermatologist for prescription anti-fungal creams.";
            } else if(text.includes('head') || text.includes('migraine') || text.includes('dizzy') || text.includes('pain')) {
                conditions = ["Tension Headache", "Dehydration-induced Migraine", "Sinusitis Pressure", "Cervical Spondylosis Strain"];
                recommendations = "Rest in a quiet, dark room, hydrate well, and avoid screen strain.";
            } else if(text.includes('stomach') || text.includes('pain') || text.includes('vomit') || text.includes('acidity') || text.includes('nausea')) {
                conditions = ["Acute Gastritis / Acidity", "Food Poisoning / Gastroenteritis", "Indigestion", "Irritable Bowel Flare"];
                recommendations = "Stick to a bland diet (like boiled rice/khichdi) and drink ORS to prevent dehydration.";
            } else {
                conditions = ["General Systemic Fatigue", "Mild Viral Syndrome", "Stress-induced Malaise", "Nutritional / Vitamin Deficiency"];
                recommendations = "Ensure 8 hours of sleep, balanced diet, and track your symptoms daily.";
            }

            let imageInfo = "No photo attached.";
            if(fileInput.files && fileInput.files[0]) {
                imageInfo = `Attached Image: <strong>${fileInput.files[0].name}</strong> (Logged for visual scan)`;
            }

            res.style.display = 'block';
            res.style.background = '#fef08a';
            res.innerHTML = `
                <h4 style="margin-bottom:8px; color:#7c3aed;">📊 Saivify Smart AI Medical Breakdown:</h4>
                <p><strong>Duration Reported:</strong> ${duration} | <strong>Severity Level:</strong> ${severity}</p>
                <p style="margin-top:6px;"><strong>Top 4 Potential Conditions Matching Input:</strong><br>
                1. ${conditions[0]}<br>
                2. ${conditions[1]}<br>
                3. ${conditions[2]}<br>
                4. ${conditions[3]}</p>
                <p style="margin-top:6px;"><strong>Visual Verification:</strong> ${imageInfo}</p>
                <hr style="margin: 8px 0; border:0; border-top:2px dashed #312e81;">
                <p style="margin-top:6px; font-size:0.95rem;"><strong>Expert Recommendation:</strong> ${recommendations}</p>
            `;
        }

        function installApp() {
            alert("Saivify PWA: Open your browser settings and select 'Add to Home Screen' or 'Install App' to run it like a native mobile app! 📱✨");
        }
    </script>
</body>
</html>
