<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saivify - Fun Health Hub! 🎨🤖</title>
    <!-- Fun Cartoony Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0f2fe;
            --card-bg: #ffffff;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent-pink: #ec4899;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --text-main: #1e1b4b;
            --border-color: #312e81;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#bae6fd 25%, transparent 25%);
            background-size: 35px 35px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cartoony Navbar */
        nav {
            background: var(--card-bg);
            border-bottom: 4px solid var(--border-color);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 0px var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-color);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .logo-area h1 {
            font-size: 2rem;
            color: var(--accent-pink);
            text-shadow: 2px 2px 0px var(--border-color);
            letter-spacing: 1px;
        }

        .pwa-btn {
            background: var(--accent-green);
            color: white;
            border: 3px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            transition: transform 0.1s;
        }

        .pwa-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        /* Responsive PC & Mobile Layout */
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            nav {
                padding: 15px 20px;
            }
        }

        /* Cartoony Card Style */
        .card {
            background: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 6px 6px 0px var(--border-color);
        }

        .card h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #ddd;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            background: #fff;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: 3px 3px 0px var(--border-color);
        }

        input:focus, textarea:focus {
            background: #fef08a;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-yellow);
            color: var(--text-main);
            border: 3px solid var(--border-color);
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            transition: all 0.1s ease;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .action-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #d9f99d;
            border: 3px solid var(--border-color);
            border-radius: 15px;
            font-weight: 700;
            display: none;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .disclaimer {
            font-size: 0.85rem;
            color: #e11d48;
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-main);
            font-weight: 600;
            border-top: 4px solid var(--border-color);
            background: #ffffff;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Cartoony Navbar -->
    <nav>
        <div class="logo-area">
            <img src="1.png" alt="Saivify Logo" onerror="this.src='https://via.placeholder.com/50'">
            <h1>SAIVIFY</h1>
        </div>
        <div class="nav-buttons">
            <button class="pwa-btn" onclick="installApp()">📥 Download App</button>
        </div>
    </nav>

    <!-- PC & Mobile Layout Grid -->
    <div class="main-container">

        <!-- BMI Calculator Module -->
        <div class="card" style="background: #eff6ff;">
            <h2>⚖️ Fun BMI Calculator</h2>
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" placeholder="e.g. 175">
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" placeholder="e.g. 70">
            </div>
            <button class="action-btn" style="background-color: #38bdf8;" onclick="calculateBMI()">Calculate BMI</button>
            <div id="bmiResult" class="result-box"></div>
        </div>

        <!-- AI Symptom & Disease Analyzer Module -->
        <div class="card" style="background: #fdf2f8;">
            <h2>🤖 AI Symptom & Disease Analyzer</h2>
            
            <div class="form-group">
                <label for="userSymptoms">Describe how you feel (Type symptoms):</label>
                <textarea id="userSymptoms" rows="3" placeholder="e.g., I have severe headache, mild fever and body pain for 2 days..."></textarea>
            </div>

            <div class="form-group">
                <label for="skinImage">Upload Photo (Optional for rashes/fungal checks):</label>
                <input type="file" id="skinImage" accept="image/*">
            </div>

            <button class="action-btn" style="background-color: #f472b6;" onclick="analyzeSymptomsAI()">Run AI Health Analysis</button>
            
            <div id="aiResult" class="result-box" style="background: #fef08a;"></div>
            <p class="disclaimer">*Disclaimer: AI analysis is for informational use only. Always visit a real doctor! 🩺</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Saivify. Level up your health with fun & tech! 🚀</p>
    </footer>

    <script>
        // BMI Calculation Logic
        function calculateBMI() {
            const h = document.getElementById('height').value;
            const w = document.getElementById('weight').value;
            const res = document.getElementById('bmiResult');

            if(!h || !w || h <= 0 || w <= 0) {
                res.style.display = 'block';
                res.style.background = '#fca5a5';
                res.innerHTML = "Oops! Please enter valid height and weight values! 😅";
                return;
            }

            const heightM = h / 100;
            const bmi = (w / (heightM * heightM)).toFixed(1);
            let msg = "";

            if(bmi < 18.5) msg = `BMI: ${bmi} — Underweight! Eat healthy nutrition! 🍎`;
            else if(bmi <= 24.9) msg = `BMI: ${bmi} — Normal & Perfectly Fit! 🎉`;
            else if(bmi <= 29.9) msg = `BMI: ${bmi} — Overweight! Time for some fun workouts! 🏃‍♂️`;
            else msg = `BMI: ${bmi} — Heavy weight! Take care of your diet! 💪`;

            res.style.display = 'block';
            res.style.background = '#d9f99d';
            res.innerHTML = msg;
        }

        // Smart Text-Based AI Symptom Analyzer Engine
        function analyzeSymptomsAI() {
            const text = document.getElementById('userSymptoms').value.toLowerCase().trim();
            const fileInput = document.getElementById('skinImage');
            const res = document.getElementById('aiResult');

            if(!text) {
                res.style.display = 'block';
                res.style.background = '#fca5a5';
                res.innerHTML = "Please type your symptoms first so the AI can analyze them! 🤖";
                return;
            }

            let matches = [];
            let advice = "Stay hydrated, take proper rest, and monitor your vitals.";

            // Intelligent text keyword detection mapping
            if(text.includes('fever') || text.includes('cold') || text.includes('cough') || text.includes('temperature')) {
                matches = ["Viral Fever / Influenza", "Common Cold", "Upper Respiratory Infection", "Seasonal Flu"];
                advice = "Keep yourself warm, drink warm fluids, and take paracetamol if required.";
            } else if(text.includes('head') || text.includes('migraine') || text.includes('dizzy') || text.includes('pain')) {
                matches = ["Tension Headache", "Dehydration Migraine", "Sinus Pressure", "Fatigue Stress"];
                advice = "Rest in a dark, quiet room and drink plenty of water.";
            } else if(text.includes('stomach') || text.includes('pain') || text.includes('vomit') || text.includes('acidity') || text.includes('nausea')) {
                matches = ["Gastritis / Acidity", "Food Poisoning", "Indigestion", "Gastroenteritis"];
                advice = "Eat light food like khichdi and drink ORS solution.";
            } else if(text.includes('skin') || text.includes('itch') || text.includes('rash') || text.includes('fungal') || text.includes('patch')) {
                matches = ["Tinea / Fungal Infection", "Contact Dermatitis", "Eczema Flare-up", "Allergic Urticaria"];
                advice = "Keep the area dry and clean. Avoid scratching.";
            } else {
                matches = ["General Fatigue", "Mild Viral Syndrome", "Stress-induced Malaise", "Nutritional Deficiency"];
                advice = "Get adequate sleep and balanced nutrition.";
            }

            let imageNotice = "No image uploaded.";
            if(fileInput.files && fileInput.files[0]) {
                imageNotice = `Image attached: <strong>${fileInput.files[0].name}</strong> (Included for visual scan)`;
            }

            res.style.display = 'block';
            res.style.background = '#fef08a';
            res.innerHTML = `
                <h4 style="margin-bottom:8px; color:#7c3aed;">🔍 Saivify AI Analysis Report:</h4>
                <p><strong>Top 4 Potential Conditions:</strong><br>1. ${matches[0]}<br>2. ${matches[1]}<br>3. ${matches[2]}<br>4. ${matches[3]}</p>
                <p style="margin-top:8px;"><strong>Visual Scan:</strong> ${imageNotice}</p>
                <p style="margin-top:8px;"><strong>AI Recommendation:</strong> ${advice}</p>
            `;
        }

        function installApp() {
            alert("Saivify PWA: Open your browser settings menu and select 'Add to Home Screen' or 'Install App' to keep it on your device! 📱✨");
        }
    </script>
</body>
</html>
